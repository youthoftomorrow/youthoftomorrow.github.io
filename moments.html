<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moments · Youth of Tomorrow</title>
  <meta name="description" content="Photos from Youth of Tomorrow events in Iowa City.">
  <meta name="theme-color" content="#0A1A2F">
  <link rel="icon" href="assets/img/logo-mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Figtree:ital,wght@0,400;0,500;0,600;1,400&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css?v=20261117">
  <link rel="stylesheet" href="css/moments.css?v=20261117">
</head>
<body data-page="moments">
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header" id="site-header"></header>

  <main id="main">
    <section class="page-hero">
      <div class="hero-sun" aria-hidden="true"></div>
      <div class="wrap">
        <h1>Moments</h1>
        <p class="lede">Photos from game nights, mosque visits, workshops and park days. Tap any photo to see it larger.</p>
      </div>
    </section>

    <!-- Photos come from js/data/photos.js -->
    <section class="section" aria-label="Photo gallery">
      <div class="wrap">
        <div class="moments-head">
          <div class="chips" role="group" aria-label="Filter photos">
            <button class="chip is-on" data-filter="all" aria-pressed="true">All</button>
            <button class="chip" data-filter="play" aria-pressed="false">Play</button>
            <button class="chip" data-filter="learn" aria-pressed="false">Learn</button>
            <button class="chip" data-filter="faith" aria-pressed="false">Faith</button>
            <button class="chip" data-filter="community" aria-pressed="false">Community</button>
          </div>
          <p class="count" id="count" aria-live="polite"></p>
        </div>
        <div class="gallery" id="gallery"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/data/programs.js?v=20261117"></script>
  <script src="js/data/photos.js?v=20261117"></script>
  <script src="js/site.js?v=20261117"></script>
  <script src="js/moments.js?v=20261117"></script>
</body>
</html>
